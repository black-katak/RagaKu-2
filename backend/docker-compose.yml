# RagaKu backend compose.
#
# The API service runs FastAPI. Body estimation from photos is done by the Gemini
# API (keys in .env), so no extra container is needed.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: "*"
    volumes:
      - /tmp:/tmp
